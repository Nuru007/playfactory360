<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102035" />
      <stop offset="50%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <radialGradient id="techGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#corpBg)" />
  
  <!-- Tech circle overlay -->
  <circle cx="400" cy="450" r="280" fill="url(#techGlow)" />
  <circle cx="400" cy="450" r="240" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="10 8" opacity="0.6" />
  <circle cx="400" cy="450" r="200" fill="none" stroke="#f06e30" stroke-width="4" opacity="0.8" />
  <circle cx="400" cy="450" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
  
  <!-- Camera lens logo in center -->
  <circle cx="400" cy="450" r="45" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />
  <circle cx="400" cy="450" r="25" fill="#f06e30" />
  <path d="M 370 410 L 430 410 L 415 390 L 385 390 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Text -->
  <text x="400" y="100" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="3">CORPORATE EVENTS</text>
  <text x="400" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="16" fill="#a0aec0">Professional Branding &amp; Activations</text>
  <text x="400" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#f06e30" opacity="0.8">REPLACE WITH CORPORATE PHOTO (800x800 px)</text>
</svg>
