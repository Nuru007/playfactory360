<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="portCorpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122c" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#portCorpBg)" />
  
  <!-- Glowing server grid layout -->
  <g opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="800" stroke="#ffffff" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="800" stroke="#ffffff" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="800" stroke="#ffffff" stroke-width="1" />
    <line x1="700" y1="0" x2="700" y2="800" stroke="#ffffff" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="800" stroke="#ffffff" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="800" stroke="#ffffff" stroke-width="1" />
    
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="550" x2="1200" y2="550" stroke="#ffffff" stroke-width="1" />
  </g>
  
  <!-- Tech symbols -->
  <polygon points="200,200 220,170 250,170 260,200 240,230 210,230" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
  <polygon points="950,500 970,470 1000,470 1010,500 990,530 960,530" fill="none" stroke="#f06e30" stroke-width="3" opacity="0.7" />
  
  <!-- Zoom search icon in center -->
  <circle cx="600" cy="400" r="60" fill="#ffffff" opacity="0.2" />
  <circle cx="590" cy="390" r="30" fill="none" stroke="#ffffff" stroke-width="6" />
  <line x1="611" y1="411" x2="640" y2="440" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Text info -->
  <text x="600" y="100" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="4">CORPORATE PORTFOLIO</text>
  <text x="600" y="150" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#e2e8f0">Branded Events &amp; Product Launches</text>
  <text x="600" y="720" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#ffffff" opacity="0.7">REPLACE WITH HIGH RES CORPORATE IMAGE (1200x800 px)</text>
</svg>
